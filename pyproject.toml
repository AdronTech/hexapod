[project]
name = "hexapod"
version = "0.1.0"
description = "Hexapod robot control software"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "websockets>=12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.4",
    "ty>=0.0.73",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hexapod"]
